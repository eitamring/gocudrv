name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: verify modules
        run: go mod verify

      - name: check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: vet
        run: |
          go vet ./...
          go vet -tags cuda_integration ./...

      - name: build with cgo off
        run: CGO_ENABLED=0 go build ./...

      - name: cross-compile supported platforms
        run: |
          GOOS=windows go build ./...
          GOOS=windows go vet ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=arm64 go vet ./...

      - name: test allocation contracts
        run: go test -count=1 -run 'Allocs$' ./...

      - name: test with race and coverage
        run: go test -v -race -count=1 -coverprofile=coverage.out ./...

      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.8.0
          only-new-issues: true

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
